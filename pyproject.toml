[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youth-self-harm-explainable-ml"
version = "1.0.0"
description = "Explainable machine learning of youth self-harm hospital admissions across English local authorities (OHID Fingertips open data)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.45",
    "statsmodels>=0.14",
    "geopandas>=1.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "pyarrow>=16",
    "pandera>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
